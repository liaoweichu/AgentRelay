claims:
  - id: "C1"
    type: "system_measurement_and_problem"
    status: "planned"
    statement: "Complete ContinuationTax can reverse a model-only route or define a repeatable region where switching is harmful."
    required_evidence: "Measured encode, transfer, rehydration, closure-check, patch, and effect-wait decomposition; native routing-reversal validation; and a phase diagram over at least two public benchmark/model-network settings."
  - id: "C2"
    type: "system_mechanism"
    status: "planned"
    statement: "An obligation-closed evidence-carrying continuation with selective predecessor patching preserves heterogeneous-model continuation fidelity more efficiently than summaries or typed deltas without dependency closure."
    required_evidence: "Forced-handoff closure/fidelity, transfer-size, missing-predecessor detection, patch precision/bytes, downstream success, and component ablations."
  - id: "C3"
    type: "method"
    status: "planned"
    statement: "A calibrated semi-Markov controller that jointly selects executor, continuation mode, commit mode, and dwell decision improves the success-latency-transfer frontier while meeting predeclared validation risk targets."
    required_evidence: "Frozen end-to-end comparison against task-level, step-level, cascade, fixed-transfer, and uncalibrated joint baselines plus coverage, risk-violation, abstention, and switch-churn analysis."
  - id: "C4"
    type: "reliability_mechanism"
    status: "planned"
    statement: "Coupling effect-frontier progress to migration legality reduces duplicate or conflicting mutations beyond a routing-independent transaction barrier."
    required_evidence: "Failure injection on official sandboxed tools with duplicate/conflicting effects, final-state correctness, migration-mask decisions, reconciliation, and recovery-latency metrics."
experiments:
