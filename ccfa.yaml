claims:
  - id: "C1"
    type: "system_measurement_and_problem"
    status: "planned"
    statement: "Complete ContinuationTax can reverse a model-only route or define a repeatable region where switching is harmful."
    required_evidence: "Measured encode, transfer, rehydration, closure-check, patch, and effect-wait decomposition; native routing-reversal validation; and a phase diagram over at least two public benchmark/model-network settings."
  - id: "C2"
    type: "system_mechanism"
    status: "planned"
    statement: "An obligation-closed evidence-carrying continuation with selective predecessor patching preserves heterogeneous-model continuation fidelity more efficiently than summaries or typed deltas without dependency closure."
    required_evidence: "Forced-handoff closure/fidelity, transfer-size, missing-predecessor detection, patch precision/bytes, downstream success, and component ablations."
  - id: "C3"
    type: "method"
    status: "planned"
    statement: "A calibrated semi-Markov controller that jointly selects executor, continuation mode, commit mode, and dwell decision improves the success-latency-transfer frontier while meeting predeclared validation risk targets."
    required_evidence: "Frozen end-to-end comparison against task-level, step-level, cascade, fixed-transfer, and uncalibrated joint baselines plus coverage, risk-violation, abstention, and switch-churn analysis."
  - id: "C4"
    type: "reliability_mechanism"
    status: "planned"
    statement: "Coupling effect-frontier progress to migration legality reduces duplicate or conflicting mutations beyond a routing-independent transaction barrier."
    required_evidence: "Failure injection on official sandboxed tools with duplicate/conflicting effects, final-state correctness, migration-mask decisions, reconciliation, and recovery-latency metrics."
experiments:
  - id: "SW-CHECK"
    scope: "software_correctness_only"
    status: "passed"
    result: "71 software tests and source compilation passed; pinned ModelScope dependency/preflight, tau2 commit/split guards, three-domain adapter and smoke runner, fixed user simulator, E4B precision sensitivity, reward-aware train/dev gate, provenance and strict resume are implemented. InterCode-SQL G10 adds tested SQL/submit/sql_submit parsing, official max-step semantics, proportional hardness sampling, paired oracle summaries, and termination/latency accounting. No model or paper result was produced locally."
  - id: "E0"
    scope: "historical_local_diagnostic"
    status: "excluded_non_gemma_non_evidence"
    result: "A legacy non-Gemma native inference passed software/provenance checks on RTX 4080 Laptop; it is retained for regression only and excluded from all model, method, and paper evidence"
  - id: "WS-GATE-50"
    scope: "diagnostic_only_invalid_legacy_split"
    status: "audited_non_evidence"
    result: "Corrected paired summary: edge/cloud reward 0.160/0.187, oracle reward 0.2937, edge/cloud exclusive successes 2/3, one shared success, union success 12%; split_validated=false"
  - id: "WS-ROUTER-GATE"
    scope: "secondary_webshop_stress_test"
    status: "deferred_after_tau2_gate"
    result: "Implemented but no longer the primary learnability workload because the audited Gemma pair success band is too low"
  - id: "TAU2-ROUTER-GATE"
    scope: "official_train_derived_three_domain_learnability"
    status: "failed_oracle_capture"
    result: "Pinned tau2 commit; 125 internal train and 53 internal dev tasks drawn only from official train; sequential E4B/12B fixed endpoints, official evaluator/user simulator, reward-aware router, provenance, and strict resume implemented. Gate failed: oracle_capture=0.0 < 0.3. Full offline audit and OOF learnability diagnosis complete. Harness normal (tool feedback verified, official schema/simulator); root cause is text-JSON tool-call format mismatch plus E4B 4-bit generation degeneration (77% identical-response loops, 96/125 episodes) and 12B never emitting structured tool calls; reward signal too sparse (only 8/125 non-tie, oracle gap 0.8pp). Fork: stop tau2 routing main experiment; migrate primary routing to InterCode-SQL; retain tau2 as hard-environment/failure-analysis. official test remains blocked"
  - id: "TAU2-SPLIT-AUDIT"
    scope: "split_sensitivity_analysis_only"
    status: "done_split_not_primary_cause_with_fallback_caveat"
    result: "Repeated stratified OOF (20 repeats, 5 folds) over all 178 tasks (125 train + 53 dev). Domain, persona, action-count-bin, and communication-vs-tool class were directly usable; high-cardinality intent/issue and final-action strata were too sparse for 5-fold and explicitly fell back to domain. Every run remains below best-fixed (capture_mean -1.75 to -1.9); oracle_gap is 0.011 (1.1pp), with 10/178 non-ties and 168 ties. Split choice is not the primary cause, but the two fallback dimensions are not claimed as independently excluded. official test remains sealed. Artifacts: results/tau2-router-gate/tau2-multifactor-split-audit.json, tau2-multifactor-task-factors.csv"
  - id: "INTERCODE-SQL-GATE"
    scope: "intercode_sql_50task_model_gate"
    status: "invalid_pending_semantic_replay"
    result: "The 50-task raw generations are retained, but the reported gate decision is invalid for benchmark use. The adapter executed a SQL code block while discarding a standalone submit emitted in the same model turn: cloud produced SQL+submit on the first response for 46/50 tasks and at least once for 50/50. It then requested another turn, manufacturing repeated-SQL loops. The old runner also awarded last-query reward at max_steps without a recognized submit, whereas official InterCode scores only on submit. G10 now recognizes strict atomic SQL+submit, gives zero official reward to max_steps_without_submit, records submission/termination/latency metrics, computes oracle-minus-best-fixed correctly, and uses seeded proportional hardness sampling. Awaiting CPU/MySQL replay of the saved responses; no new model inference or train/dev matrix is authorized. official test remains sealed."
  - id: "G14C-ROUTER-LEARNABILITY"
    scope: "intercode_sql_expanded_hardextra_router_gate"
    status: "failed_oracle_capture"
    result: "Expanded the runnable hard/extra Spider-dev pool to 314 tasks (reused 200 + inferred 114 new on 4090D edge+cloud after MySQL reinit to lower_case_table_names=1). Full-pool paired gate passes (oracle_gap 6.05pp, reward_non_tie 58, edge 0.643/cloud 0.675 success, submissions ~0.98, duplicate-loop ~0.05). G14c router learnability gate still fails under every split: by-library 14/6 (dev capture -0.33), by-task shared-lib (dev capture -0.80), and leave-one-library-out OOF pooled capture 0.24 / weighted 0.17. Router redesigns all <0.3: per-executor rich-features-no-db_hash -0.15, pairwise -0.22, confidence-gated best tau=0.20 -> 0.03. Signal is library-identity (db_hash) only; task-level features do not predict edge/cloud preference. Best honest capture ~0.24 below the 0.30 standard. Empirical failure accepted; extension stopped, artifacts retained. Artifacts: results/intercode-sql-gate-v2-hardextra340/, results/intercode-sql-g14-matrix-exp340/g14c-lolo-oof-314.json, scripts/analyze_intersql_{lolo_oof,router_redesign,selective_router}.py, scripts/run_intersql_hardextra_expand340_gate.py, scripts/build_intersql_disjoint_matrix.py"
  - id: "E1-E7"
    scope: "formal_autodl"
    status: "blocked_until_primary_workload_gate_passes"
