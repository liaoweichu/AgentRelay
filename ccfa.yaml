    result: "57 unit tests and source compilation passed; exact Gemma 4 E4B/12B formal-pair guards, official WebShop split guards, loop recovery, task-level reward router, provenance-checked resumable train/dev gate, 12 routing methods, and 7 continuation codecs implemented; no paper result produced"
  - id: "E0"
    scope: "historical_local_diagnostic"
    status: "excluded_non_gemma_non_evidence"
    result: "A legacy non-Gemma native inference passed software/provenance checks on RTX 4080 Laptop; it is retained for regression only and excluded from all model, method, and paper evidence"
